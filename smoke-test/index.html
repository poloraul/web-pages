<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Pages 发布链路自检</title>
<style>
  :root { --bg:#faf9f6; --card:#fff; --line:#e5e3dd; --text:#2c2c2a; --muted:#6b6a65; --ok:#3b6d11; }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:48px 24px 72px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:620px; margin:0 auto; }
  h1 { font-size:22px; font-weight:600; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .row:last-child { border-bottom:none; }
  .k { color:var(--muted); }
  .v { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; text-align:right; word-break:break-all; }
  .badge { display:inline-block; font-size:12px; font-weight:600; color:var(--ok); background:#eaf3de; border:1px solid #c0dd97; border-radius:20px; padding:2px 10px; }
  footer { margin-top:32px; font-size:12px; color:#9a9892; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GitHub Pages 发布链路自检</h1>
  <div class="sub">如果你能读到这一行，说明从本地 HTML 到公网地址的整条链路是通的。</div>

  <div class="card">
    <div class="row"><span class="k">状态</span><span class="badge">部署成功</span></div>
    <div class="row"><span class="k">页面标识</span><span class="v">smoke-test</span></div>
    <div class="row"><span class="k">当前时间</span><span class="v" id="now">—</span></div>
    <div class="row"><span class="k">浏览器时区</span><span class="v" id="tz">—</span></div>
    <div class="row"><span class="k">完整地址</span><span class="v" id="url">—</span></div>
  </div>

  <div class="card">
    <div class="row"><span class="k">这个页面证明了什么</span><span class="v">静态资源可公网访问</span></div>
    <div class="row"><span class="k">下一步</span><span class="v">回到目录页看看索引是否生成</span></div>
  </div>

  <footer>由 github-pages-publish 技能发布</footer>
</div>
<script>
  document.getElementById('now').textContent = new Date().toLocaleString('zh-CN');
  document.getElementById('tz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('url').textContent = location.href;
</script>
</body>
</html>
